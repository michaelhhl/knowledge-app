<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知识问答</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --paper: #fffdf8;
        --ink: #1c1916;
        --muted: #5c564e;
        --line: #ddd4c6;
        --accent: #1f4d3a;
        --accent-soft: #e4efe8;
        --warn: #8a5800;
        --warn-bg: #fbf0dc;
        --deny: #8a2f2f;
        --deny-bg: #f8e6e4;
        --ok: #1f4d3a;
        --ok-bg: #e4efe8;
        --banner: #f3e4d4;
        --shadow: 0 1px 0 rgba(28, 25, 22, 0.06);
        --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.55;
      }

      a {
        color: var(--accent);
      }

      a:focus-visible,
      button:focus-visible,
      textarea:focus-visible,
      .nav-btn:focus-visible,
      .toc a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .skip {
        position: absolute;
        left: -999px;
        top: 0;
      }

      .skip:focus {
        left: 12px;
        top: 12px;
        z-index: 10;
        background: var(--paper);
        padding: 8px 12px;
      }

      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      header.app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .brand {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      nav.primary {
        display: flex;
        gap: 6px;
      }

      .nav-btn {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .nav-btn[aria-current="page"] {
        color: var(--ink);
        background: var(--accent-soft);
        border-color: #c5d8cc;
      }

      .banner {
        margin: 0;
        padding: 10px 20px;
        background: var(--banner);
        border-bottom: 1px solid #e2d0b8;
        color: #4a3724;
      }

      .banner[hidden] {
        display: none;
      }

      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .page {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .page.active {
        display: flex;
        flex-direction: column;
      }

      .thread {
        flex: 1;
        overflow: auto;
        padding: 24px 20px 12px;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }

      .empty-hint {
        color: var(--muted);
        text-align: center;
        margin-top: 18vh;
      }

      .turn {
        margin: 0 0 16px;
      }

      .turn-q,
      .card {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .turn-q {
        margin-left: 12%;
        background: #efeae1;
      }

      .turn-label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 6px;
        text-transform: none;
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid currentColor;
        margin: 0 0 8px;
      }

      .badge-grounded {
        color: var(--ok);
        background: var(--ok-bg);
      }

      .badge-insufficient {
        color: var(--warn);
        background: var(--warn-bg);
      }

      .badge-refused {
        color: var(--deny);
        background: var(--deny-bg);
      }

      .card .md p,
      .article .md p {
        margin: 0 0 8px;
      }

      .card .md p:last-child,
      .article .md p:last-child {
        margin-bottom: 0;
      }

      .citations,
      .related {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        font-size: 0.9rem;
      }

      .citations li,
      .related li {
        margin: 0 0 4px;
      }

      .composer {
        border-top: 1px solid var(--line);
        background: var(--paper);
        padding: 12px 20px 16px;
      }

      .composer form {
        max-width: 760px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
      }

      textarea {
        width: 100%;
        min-height: 72px;
        resize: vertical;
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
      }

      button.send {
        font: inherit;
        font-weight: 650;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        min-height: 44px;
        cursor: pointer;
      }

      button.send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .status-line {
        max-width: 760px;
        margin: 6px auto 0;
        font-size: 0.85rem;
        color: var(--muted);
        min-height: 1.2em;
      }

      .knowledge {
        display: grid;
        grid-template-columns: 240px 1fr;
        min-height: 0;
        flex: 1;
      }

      .toc {
        border-right: 1px solid var(--line);
        background: #faf7f1;
        padding: 16px 12px;
        overflow: auto;
      }

      .toc h2 {
        margin: 0 12px 10px;
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
      }

      .toc ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .toc a {
        display: block;
        text-decoration: none;
        color: var(--ink);
        padding: 8px 12px;
        border-radius: 8px;
      }

      .toc a[aria-current="true"] {
        background: var(--accent-soft);
        font-weight: 650;
      }

      .article {
        overflow: auto;
        padding: 24px 28px 48px;
        background: var(--paper);
      }

      .article h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      .article h2 {
        margin: 1.4em 0 0.5em;
        font-size: 1.1rem;
      }

      .draft-flag {
        display: inline-block;
        margin-left: 8px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--warn);
        border: 1px solid var(--warn);
        background: var(--warn-bg);
        padding: 1px 6px;
        border-radius: 999px;
        vertical-align: middle;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 720px) {
        header.app-header {
          flex-wrap: wrap;
        }

        .turn-q {
          margin-left: 0;
        }

        .composer form {
          grid-template-columns: 1fr;
        }

        .knowledge {
          grid-template-columns: 1fr;
        }

        .toc {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 28vh;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#question">跳到提问框</a>
    <div class="app">
      <header class="app-header">
        <h1 class="brand">知识问答</h1>
        <nav class="primary" aria-label="主导航">
          <button type="button" class="nav-btn" id="nav-qa" data-page="qa" aria-current="page">
            问答
          </button>
          <button type="button" class="nav-btn" id="nav-kb" data-page="knowledge">知识库</button>
        </nav>
      </header>

      <p id="error-banner" class="banner" role="alert" hidden></p>

      <main>
        <section id="page-qa" class="page active" aria-label="问答">
          <div id="thread" class="thread">
            <p class="empty-hint" id="qa-empty">向知识库提问。答案只会依据已发布的 Markdown。</p>
          </div>
          <div class="composer">
            <form id="ask-form">
              <label class="skip" for="question">问题</label>
              <textarea
                id="question"
                name="question"
                rows="3"
                required
                placeholder="例如：申请韩国签证对照片有什么要求？"
              ></textarea>
              <button class="send" id="send-btn" type="submit">发送</button>
            </form>
            <p class="status-line" id="busy-status" aria-live="polite"></p>
          </div>
        </section>

        <section id="page-knowledge" class="page" aria-label="知识库" hidden>
          <div class="knowledge">
            <aside class="toc" aria-label="知识目录">
              <h2>目录</h2>
              <ul id="toc-list"></ul>
            </aside>
            <article class="article" id="article" aria-live="polite"></article>
          </div>
        </section>
      </main>
    </div>

    <script>
      (function () {
        const INDEX_URL = new URL("../knowledge/_index.md", window.location.href).href;
        const FALLBACK_TOC = [
          { title: "产品是什么", file: "what-is-this-app.md" },
          { title: "如何提问才能得到可靠答案", file: "how-to-ask.md" },
          {
            title: "韩国签证申请材料清单（日本居住者）",
            file: "korea-visa-application-documents.md",
          },
        ];

        const pages = {
          qa: document.getElementById("page-qa"),
          knowledge: document.getElementById("page-knowledge"),
        };
        const navQa = document.getElementById("nav-qa");
        const navKb = document.getElementById("nav-kb");
        const banner = document.getElementById("error-banner");
        const thread = document.getElementById("thread");
        const empty = document.getElementById("qa-empty");
        const form = document.getElementById("ask-form");
        const input = document.getElementById("question");
        const sendBtn = document.getElementById("send-btn");
        const busy = document.getElementById("busy-status");
        const tocList = document.getElementById("toc-list");
        const article = document.getElementById("article");

        let sending = false;
        let tocItems = [];

        function showBanner(text) {
          banner.hidden = !text;
          banner.textContent = text || "";
        }

        function setPage(name) {
          const isQa = name === "qa";
          pages.qa.classList.toggle("active", isQa);
          pages.knowledge.classList.toggle("active", !isQa);
          pages.qa.hidden = !isQa;
          pages.knowledge.hidden = isQa;
          if (isQa) {
            navQa.setAttribute("aria-current", "page");
            navKb.removeAttribute("aria-current");
          } else {
            navKb.setAttribute("aria-current", "page");
            navQa.removeAttribute("aria-current");
          }
          location.hash = isQa ? "qa" : "knowledge";
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function inlineMd(text) {
          return escapeHtml(text).replace(/`([^`]+)`/g, "<code>$1</code>");
        }

        function renderMarkdown(src) {
          const lines = src.replace(/\r\n/g, "\n").split("\n");
          const out = [];
          let i = 0;
          let inList = false;
          while (i < lines.length) {
            const line = lines[i];
            if (line.startsWith("---") && i === 0) {
              i += 1;
              while (i < lines.length && !lines[i].startsWith("---")) i += 1;
              i += 1;
              continue;
            }
            if (/^# /.test(line)) {
              if (inList) {
                out.push("</ul>");
                inList = false;
              }
              out.push("<h1>" + inlineMd(line.slice(2)) + "</h1>");
            } else if (/^## /.test(line)) {
              if (inList) {
                out.push("</ul>");
                inList = false;
              }
              out.push("<h2>" + inlineMd(line.slice(3)) + "</h2>");
            } else if (/^### /.test(line)) {
              if (inList) {
                out.push("</ul>");
                inList = false;
              }
              out.push("<h3>" + inlineMd(line.slice(4)) + "</h3>");
            } else if (/^[-*] /.test(line)) {
              if (!inList) {
                out.push("<ul>");
                inList = true;
              }
              out.push("<li>" + inlineMd(line.slice(2)) + "</li>");
            } else if (line.trim() === "") {
              if (inList) {
                out.push("</ul>");
                inList = false;
              }
            } else {
              if (inList) {
                out.push("</ul>");
                inList = false;
              }
              out.push("<p>" + inlineMd(line) + "</p>");
            }
            i += 1;
          }
          if (inList) out.push("</ul>");
          return '<div class="md">' + out.join("") + "</div>";
        }

        function parseIndex(md) {
          const items = [];
          const re = /\[([^\]]+)\]\(\.\/([^)]+)\)/g;
          let m;
          while ((m = re.exec(md))) {
            items.push({ title: m[1], file: m[2] });
          }
          return items;
        }

        function knowledgeUrl(file) {
          return new URL("../knowledge/" + file, window.location.href).href;
        }

        function renderToc(items, currentFile) {
          tocList.innerHTML = items
            .map(function (item) {
              const current = item.file === currentFile ? ' aria-current="true"' : "";
              return (
                "<li><a href=\"#knowledge/" +
                encodeURIComponent(item.file) +
                '"' +
                current +
                ">" +
                escapeHtml(item.title) +
                "</a></li>"
              );
            })
            .join("");
        }

        async function loadArticle(file) {
          const meta = tocItems.find(function (x) {
            return x.file === file;
          });
          const title = meta ? meta.title : file;
          renderToc(tocItems, file);
          try {
            const res = await fetch(knowledgeUrl(file));
            if (!res.ok) throw new Error("http " + res.status);
            const text = await res.text();
            article.innerHTML = renderMarkdown(text);
          } catch (err) {
            article.innerHTML =
              "<h1>" +
              escapeHtml(title) +
              "</h1><p class=\"muted\">静态页无法读取 <code>knowledge/" +
              escapeHtml(file) +
              "</code>。请从仓库根目录用本地静态服务器打开本页（例如 <code>npx serve</code>），或直接查看该 Markdown 文件。正文不会复制进本 HTML。</p>";
          }
        }

        async function loadToc() {
          try {
            const res = await fetch(INDEX_URL);
            if (!res.ok) throw new Error("index");
            const md = await res.text();
            const parsed = parseIndex(md);
            tocItems = parsed.length ? parsed : FALLBACK_TOC;
          } catch (err) {
            tocItems = FALLBACK_TOC;
          }
          if (!tocItems.length) {
            article.innerHTML =
              "<p>知识库还没有已发布的文档。请在 knowledge/ 添加 Markdown。</p>";
            return;
          }
          const fromHash = location.hash.match(/^#knowledge\/(.+)$/);
          const file = fromHash ? decodeURIComponent(fromHash[1]) : tocItems[0].file;
          await loadArticle(file);
        }

        function badgeLabel(status) {
          if (status === "grounded") return { cls: "badge-grounded", text: "有依据" };
          if (status === "insufficient") return { cls: "badge-insufficient", text: "依据不足" };
          return { cls: "badge-refused", text: "已拒绝" };
        }

        function mockAnswer(question) {
          const q = question.trim();
          const lower = q.toLowerCase();
          if (/违法|伤害|越权|攻击|黑客|炸弹/.test(q)) {
            return {
              answer_status: "refused",
              answer_markdown: "无法协助该请求。",
              citations: [],
              related: [],
            };
          }
          if (/签证|护照|照片|住民票|在留|在职|余额|工资/.test(q)) {
            return {
              answer_status: "grounded",
              answer_markdown:
                "申请韩国签证时，须在申请书上贴 1 张彩色照片：横 3.5 cm × 纵 4.5 cm，白底，6 个月内拍摄，并打印在相纸上。\n\n其他材料（护照有效期、在留卡、住民票等）见同一篇清单中的对应小节。",
              citations: [
                {
                  file: "korea-visa-application-documents.md",
                  heading: "照片",
                  title: "韩国签证申请材料清单（日本居住者）",
                },
              ],
              related: [],
            };
          }
          if (/产品是什么|这是什么应用|知识库/.test(q)) {
            return {
              answer_status: "grounded",
              answer_markdown:
                "这是一个基于本地 Markdown 知识库的 AI 问答应用：先检索文档，再根据命中的段落回答，并给出出处。",
              citations: [
                {
                  file: "what-is-this-app.md",
                  heading: "一句话",
                  title: "产品是什么",
                },
              ],
              related: [],
            };
          }
          return {
            answer_status: "insufficient",
            answer_markdown:
              "当前知识库里没有足够依据回答这个问题。我不能靠猜测补全。你可以补充文档，或换一种问法（例如具体流程名称）。\n\n你可能想看：如何提问才能得到可靠答案。",
            citations: [],
            related: [{ file: "how-to-ask.md", title: "如何提问才能得到可靠答案" }],
          };
        }

        function citationHref(c) {
          const hash = c.heading ? encodeURIComponent(c.heading) : "";
          return "#knowledge/" + encodeURIComponent(c.file) + (hash ? "/" + hash : "");
        }

        function citationLabel(c) {
          if (c.title) return c.title + (c.heading ? " · " + c.heading : "");
          return c.file + (c.heading ? "#" + c.heading : "");
        }

        function appendTurn(question, result) {
          if (empty) empty.remove();
          const qEl = document.createElement("div");
          qEl.className = "turn";
          qEl.innerHTML =
            '<p class="turn-label">问题</p><div class="turn-q">' +
            escapeHtml(question) +
            "</div>";
          const badge = badgeLabel(result.answer_status);
          const cites = (result.citations || [])
            .map(function (c) {
              return (
                "<li><a href=\"" +
                citationHref(c) +
                "\">" +
                escapeHtml(citationLabel(c)) +
                "</a></li>"
              );
            })
            .join("");
          const related = (result.related || [])
            .map(function (c) {
              return (
                "<li><a href=\"" +
                citationHref(c) +
                "\">" +
                escapeHtml(c.title || c.file) +
                "</a></li>"
              );
            })
            .join("");
          const aEl = document.createElement("div");
          aEl.className = "turn";
          aEl.innerHTML =
            '<p class="turn-label">答案</p><div class="card">' +
            '<span class="badge ' +
            badge.cls +
            '">' +
            badge.text +
            "</span>" +
            renderMarkdown(result.answer_markdown) +
            (cites ? '<p class="turn-label">出处</p><ul class="citations">' + cites + "</ul>" : "") +
            (related ? '<p class="turn-label">相近文档</p><ul class="related">' + related + "</ul>" : "") +
            "</div>";
          thread.appendChild(qEl);
          thread.appendChild(aEl);
          thread.scrollTop = thread.scrollHeight;
        }

        function routeFromHash() {
          const h = location.hash || "#qa";
          if (h.indexOf("#knowledge") === 0) {
            setPage("knowledge");
            const m = h.match(/^#knowledge\/([^/]+)/);
            if (m && tocItems.length) loadArticle(decodeURIComponent(m[1]));
          } else {
            setPage("qa");
          }
        }

        navQa.addEventListener("click", function () {
          setPage("qa");
        });
        navKb.addEventListener("click", function () {
          setPage("knowledge");
          if (tocItems[0]) loadArticle(tocItems[0].file);
        });

        tocList.addEventListener("click", function (e) {
          const a = e.target.closest("a");
          if (!a) return;
          e.preventDefault();
          const m = a.getAttribute("href").match(/^#knowledge\/(.+)$/);
          if (m) loadArticle(decodeURIComponent(m[1]));
          location.hash = a.getAttribute("href");
        });

        thread.addEventListener("click", function (e) {
          const a = e.target.closest("a");
          if (!a || a.getAttribute("href").indexOf("#knowledge/") !== 0) return;
          e.preventDefault();
          location.hash = a.getAttribute("href");
          setPage("knowledge");
          const m = a.getAttribute("href").match(/^#knowledge\/([^/]+)/);
          if (m) loadArticle(decodeURIComponent(m[1]));
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          const q = input.value.trim();
          if (!q || sending) return;
          sending = true;
          sendBtn.disabled = true;
          busy.textContent = "正在检索 / 正在生成";
          input.value = "";
          window.setTimeout(function () {
            appendTurn(q, mockAnswer(q));
            sending = false;
            sendBtn.disabled = false;
            busy.textContent = "";
            input.focus();
          }, 500);
        });

        window.addEventListener("hashchange", routeFromHash);

        loadToc().then(function () {
          routeFromHash();
        });

        showBanner("");
      })();
    </script>
  </body>
</html>
